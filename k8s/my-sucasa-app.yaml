# Replace DOCKERHUB_USERNAME before applying. This deploys the original site.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-sucasa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-sucasa
  template:
    metadata:
      labels:
        app: my-sucasa
    spec:
      containers:
        - name: my-sucasa
          image: DOCKERHUB_USERNAME/my-sucasa:v1
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: my-sucasa
spec:
  type: NodePort
  selector:
    app: my-sucasa
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
